<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <title>{% block title %}Электронный журнал{% endblock %}</title>
 {% load static %}
 <link href="{% static 'journal/css/styles.css' %}" rel="stylesheet">
</head>
<body>
 <nav>
 <ul>
 <li><a href="{% url 'home' %}">Главная</a></li>
 <li><a href="{% url 'about' %}">О системе</a></li>
 <li><a href="{% url 'contacts' %}">Контакты</a></li>
 <li><a href="{% url 'register' %}">Регистрация</a></li>
 {% if user.is_staff %}
 <li><a href="{% url 'attendance_add' %}">Отметить посещаемость</a></li>
 {% endif %}
 </ul>
 </nav>
 <main class="content">
 {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2025 Электронный журнал. Учебный проект.</p>
    </footer>
</body>
</html>
